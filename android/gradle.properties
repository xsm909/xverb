org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler could not close its own caches here — every
# Android build failed on `:shared_preferences_android:compileDebugKotlin`
# with "Could not close incremental caches", and deleting them only meant it
# recreated and failed on them again. Nothing in this project is written in
# Kotlin, so incremental compilation of the plugins buys us nothing worth a
# build that does not run.
kotlin.incremental=false
